<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payroll Full Loop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 24'%3E%3Cpath d='M24 12C18 4 7 4 7 12s11 8 17 0 17-8 17 0-11 8-17 0z' fill='none' stroke='%230e9fb3' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก">
      <a class="brand" href="#/dashboard" style="text-decoration:none">
        <svg class="brand-logo" viewBox="0 0 48 24" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#2bc0cf"/><stop offset="1" stop-color="#0e9fb3"/></linearGradient></defs>
          <path d="M24 12C18 4 7 4 7 12s11 8 17 0 17-8 17 0-11 8-17 0z" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="brand-name">Payroll<br>Full Loop</div>
        <div class="brand-tag">Smart Payroll. Complete Control.</div>
      </a>
      <a class="back-host" href="/#home" title="กลับไปหน้าเลือกหมวดงานของระบบ HR รวมศูนย์">← กลับระบบ HR</a>
      <nav class="nav" id="nav"></nav>
      <div class="side-user" id="sideUser"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn hamburger" id="menuBtn" aria-label="เปิดเมนู"></button>
        <div class="search">
          <span id="searchIc"></span>
          <input id="gsearch" type="search" autocomplete="off" placeholder="ค้นหาชื่อพนักงาน, แผนก หรือรหัสพนักงาน... (Ctrl + K)" aria-label="ค้นหา">
          <div class="search-pop" id="searchPop" hidden></div>
        </div>
        <div class="top-actions">
          <label class="period-pick" title="รอบเงินเดือนที่กำลังทำงาน"><span id="periodIc"></span><select id="periodSel" aria-label="รอบเงินเดือน"></select></label>
          <div class="bell-wrap">
            <button class="icon-btn" id="bellBtn" aria-label="การแจ้งเตือน"></button>
            <div class="bell-pop" id="bellPop" hidden></div>
          </div>
          <div class="company" id="companyName"></div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/payroll.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/import.js"></script>
  <script src="js/views/schedule.js"></script>
  <script src="js/views/mapping.js"></script>
  <script src="js/views/requests.js"></script>
  <script src="js/views/calc.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/export.js"></script>
  <script src="js/views/payroll.js"></script>
  <script src="js/views/payreports.js"></script>
  <script src="js/views/paysetup.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/help.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
