<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ประเมินผลหลังการฝึกอบรม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Sarabun',sans-serif;background:#eef1f7;color:#1f2a44;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#5a6478;font-size:14px}.info{background:#eef4ff;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
label{display:block;font-weight:600;margin:16px 0 6px}.stars{display:flex;gap:8px}.stars button{flex:1;padding:12px 0;font-size:20px;border:2px solid #cfd6e4;background:#fff;border-radius:12px;cursor:pointer;font-family:inherit}
.stars button.on{background:#2450b8;border-color:#2450b8;color:#fff}.hint{display:flex;justify-content:space-between;font-size:12px;color:#5a6478;margin-top:4px}
.opt{display:block;border:2px solid #cfd6e4;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}.opt input{margin-right:8px}
textarea,input[type=text]{width:100%;border:2px solid #cfd6e4;border-radius:12px;padding:10px;font-family:inherit;font-size:16px}
.go{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#2450b8;color:#fff;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer}.go[disabled]{opacity:.5}
.msg{text-align:center;padding:30px 10px;font-size:18px}.err{color:#b42323;font-size:14px;margin-top:8px}
</style></head><body><div class="wrap" id="app"><div class="card msg">กำลังโหลด...</div></div>
<script>
var URL_='https://zkqewnwulnugbhndtnkr.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprcWV3bnd1bG51Z2JobmR0bmtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTM5MjEsImV4cCI6MjEwMTQ4OTkyMX0.Rfo2492G7DtkhQuPfHCXCPX0jRIHUceRpDDd8AlHJh0';
var token=new URLSearchParams(location.search).get('t')||'', rating=0, info=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rpc(fn,body){return fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();});}
function show(html){document.getElementById('app').innerHTML=html;}
function msg(t){show('<div class="card msg">'+t+'</div>');}
if(!/^[0-9a-f]{32}$/.test(token)){msg('ลิงก์ไม่ถูกต้อง กรุณาติดต่อฝ่ายทรัพยากรบุคคล');}
else rpc('get_followup_link',{p_token:token}).then(function(j){
  if(!j||!j.course){msg('ไม่พบลิงก์นี้ หรือลิงก์ถูกยกเลิกแล้ว');return;}
  if(j.used){msg('✅ ลิงก์นี้ถูกใช้ประเมินไปแล้ว ขอบคุณครับ/ค่ะ');return;}
  info=j;
  show('<div class="card"><h1>ประเมินผลหลังการฝึกอบรม</h1><div class="sub">ฝ่ายทรัพยากรบุคคล · ใช้เวลาประมาณ 2 นาที</div>'
   +'<div class="info"><b>พนักงาน:</b> '+esc(j.employee)+'<br><b>หลักสูตร:</b> '+esc(j.course)+'</div>'
   +'<label>1. หลังอบรม พนักงานนำความรู้ไปใช้ในงานได้ระดับใด *</label><div class="stars" id="stars">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-n="'+n+'">'+n+'</button>';}).join('')+'</div><div class="hint"><span>น้อยที่สุด</span><span>มากที่สุด</span></div>'
   +'<label>2. การนำไปใช้ *</label>'+['นำไปใช้ได้ดี','ใช้ได้บางส่วน','ยังไม่ได้นำไปใช้'].map(function(t,i){return '<label class="opt" style="font-weight:400;margin:6px 0"><input type="radio" name="ap" value="'+t+'"'+(i===0?' checked':'')+'>'+t+'</label>';}).join('')
   +'<label>3. ผลที่เห็นต่อการปฏิบัติงาน / KPI</label><textarea id="impact" rows="3" placeholder="เช่น ทำงานเร็วขึ้น ข้อผิดพลาดลดลง"></textarea>'
   +'<label>4. ควรพัฒนาเพิ่มเติมเรื่องใด</label><textarea id="next" rows="2"></textarea>'
   +'<label>5. ชื่อผู้ประเมิน (หัวหน้างาน)</label><input type="text" id="sup" value="'+esc(j.supervisor||'')+'">'
   +'<div class="err" id="err"></div><button class="go" id="go">ส่งผลการประเมิน</button></div>');
  document.getElementById('stars').onclick=function(e){var b=e.target.closest('button');if(!b)return;rating=Number(b.dataset.n);[].forEach.call(this.children,function(x){x.classList.toggle('on',Number(x.dataset.n)<=rating);});};
  document.getElementById('go').onclick=function(){
    if(!rating){document.getElementById('err').textContent='กรุณาเลือกคะแนน 1-5';return;}
    var btn=this;btn.disabled=true;btn.textContent='กำลังส่ง...';
    rpc('submit_followup',{p_token:token,p_rating:rating,p_applied:document.querySelector('input[name=ap]:checked').value,p_impact:document.getElementById('impact').value,p_next:document.getElementById('next').value,p_supervisor:document.getElementById('sup').value})
     .then(function(r){ if(r==='ok') msg('✅ ส่งผลการประเมินเรียบร้อยแล้ว<br>ขอบคุณสำหรับความร่วมมือครับ/ค่ะ'); else if(r==='used') msg('ลิงก์นี้ถูกใช้ประเมินไปแล้ว'); else {btn.disabled=false;btn.textContent='ส่งผลการประเมิน';document.getElementById('err').textContent='ส่งไม่สำเร็จ กรุณาลองใหม่';} })
     .catch(function(){btn.disabled=false;btn.textContent='ส่งผลการประเมิน';document.getElementById('err').textContent='เชื่อมต่อไม่ได้ กรุณาลองใหม่';});
  };
}).catch(function(){msg('เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่ภายหลัง');});
</script></body></html>
